[workspace]
resolver = "2"
members = ["crates/nme-web", "crates/nme-run"]

[workspace.package]
version = "0.7.0"
edition = "2021"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Release profile tuned for a browser download: size beats compile time here,
# because every visitor pays the byte cost of this artifact exactly once.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
