[package]
name = "nme-run"
description = "Runs the Python that NME compiles to, inside the visitor's browser, using the RustPython interpreter."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# Same wasm-opt feature flags as nme-web; see that manifest for why.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
]

[dependencies]
# MIT-licensed pure-Rust Python. Chosen over Pyodide because Pyodide is
# MPL-2.0, which is outside this project's allowed-licence list, and because a
# single Rust artifact keeps the site free of third-party CDN downloads.
rustpython-vm = { version = "0.4", default-features = false, features = ["freeze-stdlib", "compiler"] }
rustpython-stdlib = { version = "0.4", default-features = false }
# Ships the pure-Python half of the standard library (random, json, hashlib,
# datetime, secrets ...) inside the binary, so `import random` works with no
# file system to read it from.
rustpython-pylib = { version = "0.4", features = ["freeze-stdlib"] }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `random`/`secrets` reach os.urandom, which on this target must be told to use
# the browser's crypto API. Both getrandom majors appear in the tree.
getrandom = { version = "0.2", features = ["js"] }
getrandom_v03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
