<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NeedMoreEasy">
  <!-- Achromatic on purpose: red, yellow and green are reserved for state
       everywhere on this site, and an icon is not a state. The two tones
       follow the browser's own theme so the mark keeps its contrast in both. -->
  <style>
    .ground { fill: #16191f; }
    .mark { stroke: #f4f6f9; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #f1f3f7; }
      .mark { stroke: #14171c; }
    }
  </style>
  <rect class="ground" width="64" height="64" rx="15"/>
  <path class="mark" d="M14 32h27M31 21l11 11-11 11" fill="none" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
